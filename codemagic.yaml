workflows:
  build-macos:
    name: Build Pimiento Video macOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest

    scripts:
      - name: Installer Python et les outils
        script: |
          python3 --version
          brew install ffmpeg exiftool || true

      - name: Installer les dependances Python
        script: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller
          python3 -m pip install PySide6 yt-dlp imageio-ffmpeg soundfile numpy
          python3 -m pip install pedalboard noisereduce demucs
          python3 -m pip install faster-whisper
          python3 -m pip install torch torchaudio

      - name: Decompresser assets
        script: |
          if [ -f "assets.zip" ]; then
            echo "assets.zip trouve, decompression..."
            rm -rf assets
            unzip -q assets.zip
            if [ -d "assets/assets" ] && [ ! -f "assets/logo.png" ]; then
              mv assets assets_tmp
              mv assets_tmp/assets assets
              rm -rf assets_tmp
            fi
            echo "Contenu de assets/ :"
            ls -la assets/
          else
            echo "Pas de assets.zip : le dossier assets/ doit etre present."
          fi

      - name: Generer l'icone macOS
        script: |
          if [ -f "assets/logo.png" ] && [ ! -f "assets/logo.icns" ]; then
            mkdir -p icon.iconset
            sips -z 16 16     assets/logo.png --out icon.iconset/icon_16x16.png
            sips -z 32 32     assets/logo.png --out icon.iconset/icon_16x16@2x.png
            sips -z 32 32     assets/logo.png --out icon.iconset/icon_32x32.png
            sips -z 64 64     assets/logo.png --out icon.iconset/icon_32x32@2x.png
            sips -z 128 128   assets/logo.png --out icon.iconset/icon_128x128.png
            sips -z 256 256   assets/logo.png --out icon.iconset/icon_128x128@2x.png
            sips -z 256 256   assets/logo.png --out icon.iconset/icon_256x256.png
            sips -z 512 512   assets/logo.png --out icon.iconset/icon_256x256@2x.png
            sips -z 512 512   assets/logo.png --out icon.iconset/icon_512x512.png
            sips -z 1024 1024 assets/logo.png --out icon.iconset/icon_512x512@2x.png
            iconutil -c icns icon.iconset -o assets/logo.icns
          fi

      - name: Construire l'application
        script: |
          pyinstaller pimiento_mac.spec --noconfirm

      - name: Creer le .dmg
        script: |
          mkdir -p dmg_temp
          cp -R "dist/Pimiento Video.app" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create \
            -volname "Pimiento Video" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "PimientoVideo-1.0.dmg"

    artifacts:
      - PimientoVideo-1.0.dmg
