workflows:
  build-macos:
    name: Build Pimiento Video macOS
    # Machine Mac fournie par Codemagic
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest

    scripts:
      - name: Installer Python et les outils
        script: |
          # Python 3.12 est deja present sur les machines Codemagic.
          python3 --version
          # FFmpeg et ExifTool via Homebrew
          brew install ffmpeg exiftool mediainfo || true

      - name: Installer les dependances Python
        script: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller
          python3 -m pip install PySide6 imageio-ffmpeg soundfile numpy
          python3 -m pip install --upgrade "yt-dlp[default]"
          python3 -m pip install pedalboard noisereduce demucs
          python3 -m pip install faster-whisper
          python3 -m pip install torch torchaudio
          python3 -m pip install deep-translator pdf2docx docx2pdf
          python3 -m pip install pymediainfo
          python3 -m pip install python-docx reportlab pyaaf2
          python3 -m pip install pymupdf pdfplumber pypdf openpyxl

      - name: Decompresser assets
        script: |
          if [ -f "assets.zip" ]; then
            echo "assets.zip trouve, decompression..."
            rm -rf assets
            unzip -q assets.zip
            if [ -d "assets/assets" ] && [ ! -f "assets/logo.png" ]; then
              mv assets assets_tmp
              mv assets_tmp/assets assets
              rm -rf assets_tmp
            fi
            echo "Contenu de assets/ :"
            ls -la assets/
          else
            echo "Pas de assets.zip : le dossier assets/ doit etre present."
          fi

      - name: Generer l'icone macOS
        script: |
          # Source de l'icone : logo_icon.png (le bon logo, comme sur PC).
          # Repli sur logo.png si logo_icon.png absent.
          ICON_SRC="assets/logo_icon.png"
          if [ ! -f "$ICON_SRC" ]; then ICON_SRC="assets/logo.png"; fi
          if [ -f "$ICON_SRC" ]; then
            rm -f assets/logo.icns
            mkdir -p icon.iconset
            sips -z 16 16     "$ICON_SRC" --out icon.iconset/icon_16x16.png
            sips -z 32 32     "$ICON_SRC" --out icon.iconset/icon_16x16@2x.png
            sips -z 32 32     "$ICON_SRC" --out icon.iconset/icon_32x32.png
            sips -z 64 64     "$ICON_SRC" --out icon.iconset/icon_32x32@2x.png
            sips -z 128 128   "$ICON_SRC" --out icon.iconset/icon_128x128.png
            sips -z 256 256   "$ICON_SRC" --out icon.iconset/icon_128x128@2x.png
            sips -z 256 256   "$ICON_SRC" --out icon.iconset/icon_256x256.png
            sips -z 512 512   "$ICON_SRC" --out icon.iconset/icon_256x256@2x.png
            sips -z 512 512   "$ICON_SRC" --out icon.iconset/icon_512x512.png
            sips -z 1024 1024 "$ICON_SRC" --out icon.iconset/icon_512x512@2x.png
            iconutil -c icns icon.iconset -o assets/logo.icns
          fi

      - name: Embarquer ffmpeg et ffprobe
        script: |
          # Copier ffmpeg ET ffprobe (installes par Homebrew) dans assets/,
          # pour que Media Info et l'encodeur fonctionnent sans dependance
          # systeme chez l'utilisateur final.
          mkdir -p assets/ffmpeg
          FFMPEG_BIN=$(which ffmpeg || true)
          FFPROBE_BIN=$(which ffprobe || true)
          if [ -n "$FFMPEG_BIN" ]; then
            cp "$FFMPEG_BIN" assets/ffmpeg/ffmpeg
            echo "ffmpeg copie depuis $FFMPEG_BIN"
          fi
          if [ -n "$FFPROBE_BIN" ]; then
            cp "$FFPROBE_BIN" assets/ffmpeg/ffprobe
            echo "ffprobe copie depuis $FFPROBE_BIN"
          fi
          chmod +x assets/ffmpeg/* 2>/dev/null || true
          ls -la assets/ffmpeg/

      - name: Construire l'application
        script: |
          pyinstaller pimiento_mac.spec --noconfirm

      - name: Creer le .dmg
        script: |
          mkdir -p dmg_temp
          cp -R "dist/Pimiento Video.app" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create \
            -volname "Pimiento Video" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "PimientoVideo-1.0.dmg"

    artifacts:
      # Le .dmg sera telechargeable a la fin du build
      - PimientoVideo-1.0.dmg
